name: build
# CI only checks that the app builds. Releases are signed + notarized locally:
#   SIGN_IDENTITY="Developer ID Application: …" VERSION=x.y.z ./scripts/build-app.sh --release
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: ./scripts/build-app.sh --dmg
      - uses: actions/upload-artifact@v4
        with: { name: SideStats-unsigned, path: dist/SideStats-*.dmg }
